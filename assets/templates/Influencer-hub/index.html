<!-- <!DOCTYPE html> is NOT an HTML tag!
 It's an instruction telling the web browser to use modern HTML5 standards
 so the page doesn't render in old, buggy "quirks mode". -->

 <DOCtype html>
 <html lang="en">
 <head>
     <meta charset="UTF-8">

     <!-- Viewport meta tag: Tells mobile devices to render the page at the actual screen width
      instead of shrinking a giant desktop layout down to phone size.-->
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>Influencer Hub - Web Template</title>
      <link rel="stylesheet" href="style.css">
 </head>
 <body>

    <!-- Semantic Header tag: A box with a job title. Tells search engines and screen readers
     that this top section is the introductory header of the page. -->
     <header class="hero-section">

         <!-- DIV (Division): Think of a <div> as a generic cardboard box wrapper.
            It has no visual style on it's own, but we use it to group items
            togther so we can style and center them as a single bundle-->
            <div class="hero-content">
                <span class="badge">Creator & Influencer Hub</span>
                <h1>Alex Rivers</h1>
                <p class="tagline">Digital Content Creator | Tech & Lifestyle</p>

                <!-- Navigation Action Buttons Grouped Inside a Div -->
                <div class="hero-actions">
                    <a href="#bio" class="btn btn-primary">About & Bio</a>
                    <a href="#photos" class="btn btn-secondary">Photo Gallery</a>
                    <a href="#videos" class="btn btn-secondary">Video Highlights</a>
                </div>
            </div>

     </header>
     
 </body>
 </html>
